name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the full test suite
        run: bash tests/run-all.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the kit scripts and tests
        run: |
          shellcheck -x tests/*.sh
          shellcheck -x -S warning docker/bin/wt docker/bin/test/unit docker/bin/phpcs docker/bin/docker-compose agents/hooks/*.sh
